events {
  worker_connections 1024;
}

http {
  server_tokens off;

  # Cloudflare IPs — generated at runtime by entrypoint.sh
  include /etc/nginx/cloudflare_ips.conf;

  # Docker internal DNS
  resolver 127.0.0.11 valid=30s;
  resolver_timeout 5s;

  # Security headers
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Fallback to https if Cloudflare does not send X-Forwarded-Proto
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      "https";
  }

  # ── ACME challenge + HTTP redirect ────────────────────────────────────────
  server {
    listen 80;
    server_name odontoehtec.com www.odontoehtec.com app.odontoehtec.com api.odontoehtec.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Landing Page ──────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name odontoehtec.com www.odontoehtec.com;

    ssl_certificate     /etc/letsencrypt/live/odontoehtec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odontoehtec.com/privkey.pem;

    location / {
      proxy_pass            http://landing:3002;
      proxy_http_version    1.1;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection "upgrade";
      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
    }
  }

  # ── Frontend App ──────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name app.odontoehtec.com;

    ssl_certificate     /etc/letsencrypt/live/odontoehtec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odontoehtec.com/privkey.pem;

    location / {
      proxy_pass            http://front:3001;
      proxy_http_version    1.1;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection "upgrade";
      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
    }
  }

  # ── API ───────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.odontoehtec.com;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/odontoehtec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odontoehtec.com/privkey.pem;

    location / {
      proxy_pass            http://api:3000;
      proxy_http_version    1.1;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection "upgrade";
      proxy_read_timeout    120s;
      proxy_connect_timeout 10s;
    }
  }
}
