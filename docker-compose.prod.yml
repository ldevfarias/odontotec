services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/odonto-api/Dockerfile
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      NODE_ENV: production
      POSTGRES_SSL: 'false'
    depends_on:
      - db
    networks:
      - internal
      - web
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode>=500?1:0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  front:
    build:
      context: .
      dockerfile: apps/odonto-front/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    networks:
      - web
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001',r=>process.exit(r.statusCode>=500?1:0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: always
    networks:
      - web
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3002',r=>process.exit(r.statusCode>=500?1:0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
      landing:
        condition: service_healthy
    networks:
      - web

networks:
  internal:
  web:

volumes:
  postgres_data:
